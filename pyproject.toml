[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "g1_inspire_sdk"
version = "0.1.0"
description = "Modular control interface for the Unitree G1 humanoid and Inspire RH56 dexterous hand"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Soofiyan Atar" }]
dependencies = [
    "numpy",
    "pyyaml",
    "casadi",
    "rerun-sdk>=0.20",
    # Pinocchio is intentionally NOT listed here. The code does
    # `from pinocchio import casadi as cpin` (see _ik/ik.py), which needs a
    # Pinocchio build that ships the CasADi bindings. Only conda-forge's
    # `pinocchio` (>=3.0) includes them; the PyPI `pin` wheel does not (and
    # the PyPI package literally named "pinocchio" is unrelated). Install it
    # via conda BEFORE `pip install -e .` -- see environment.yml / README.
    #
    # Bring-up note: unitree_sdk2py + inspire_sdkpy live outside PyPI; install
    # them from your checkout (unitree_sdk2py also needs CycloneDDS). See README.
]

[project.optional-dependencies]
# Inspire hand modbus state reader. Required only for live Inspire control.
hand = ["pymodbus"]
# RealSense D435i camera support. Required only when using RealSenseCamera
# or G1InspireRobot(camera=...). Skip if you only need arm + hand control.
camera = ["pyrealsense2"]
# Meshcat-based visualization (only needed when G1_29_ArmIK is constructed
# with Visualization=True; not used by RerunPreview).
viz = ["meshcat"]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["g1_inspire_sdk*"]

[tool.setuptools.package-data]
"g1_inspire_sdk._config" = ["*.yaml"]
"g1_inspire_sdk._ik" = ["*.pkl"]
